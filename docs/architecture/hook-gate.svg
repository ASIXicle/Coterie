<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="900" height="1020" role="img" aria-labelledby="ttl">
  <title id="ttl">The settings-hook gate</title>
  <defs>
    <marker id="gA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8b94"></path></marker>
    <marker id="gB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5ad"></path></marker>
  </defs>
  <rect width="900" height="1020" fill="#f3f5f7"></rect>
  <text x="16" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#616c75">the hash is the gate; the content analyser only ranks severity</text>

  <g fill="#fafcfe" stroke="#ccd5dc">
    <rect x="330" y="46" width="240" height="60"></rect>
    <rect x="300" y="146" width="300" height="64"></rect>
    <rect x="270" y="250" width="360" height="66"></rect>
    <rect x="480" y="500" width="380" height="120"></rect>
    <rect x="280" y="790" width="340" height="60"></rect>
    <rect x="280" y="900" width="340" height="60"></rect>
    <rect x="660" y="900" width="200" height="60"></rect>
  </g>
  <polygon points="250,405 274,370 626,370 650,405 626,440 274,440" fill="#eaeef2" stroke="#9aa5ad"></polygon>
  <rect x="40" y="500" width="200" height="60" fill="#fafcfe" stroke="#ccd5dc"></rect>
  <rect x="480" y="670" width="180" height="60" fill="#fafcfe" stroke="#a14b3e"></rect>
  <rect x="680" y="670" width="180" height="60" fill="#fafcfe" stroke="#b5ad9c"></rect>
  <rect x="40" y="880" width="200" height="100" fill="#eaeef2" stroke="#dbe2e8" stroke-dasharray="3 4"></rect>

  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e2328">
    <text x="450" y="72" text-anchor="middle">weekly timer, root</text>
    <text x="450" y="169" text-anchor="middle">scanner</text>
    <text x="450" y="278" text-anchor="middle">canonical hash (CLAUDE.md: raw)</text>
    <text x="450" y="410" text-anchor="middle" font-size="13">row in the approved registry?</text>
    <text x="54" y="528">silent</text>
    <text x="494" y="528">content analyser</text>
    <text x="450" y="818" text-anchor="middle">log the finding</text>
    <text x="450" y="920" text-anchor="middle">with the news feed: stored</text>
    <text x="760" y="920" text-anchor="middle">without it: unit fails</text>
  </g>
  <g font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a14b3e">
    <text x="494" y="698">HIGH</text>
  </g>
  <text x="694" y="698" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e2328">MEDIUM: baseline miss,</text>
  <text x="694" y="714" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#5b666f">content clean</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#5b666f">
    <text x="450" y="90" text-anchor="middle">read-only filesystem except its own log</text>
    <text x="54" y="546">logged as evaluated, no alert</text>
    <text x="450" y="187" text-anchor="middle">walk each agent's settings file and CLAUDE.md</text>
    <text x="450" y="200" text-anchor="middle">(editor task files: pattern match only)</text>
    <text x="614" y="172">a linked .claude, or a link,</text>
    <text x="614" y="185">pipe or device where a file</text>
    <text x="614" y="198">belongs: HIGH, never read</text>
    <text x="450" y="296" text-anchor="middle">strip volatile preference keys with type checks, then hash</text>
    <text x="494" y="548">pipe-to-shell · decode-then-exec · credential-path read</text>
    <text x="494" y="566">secret env · env dump into POST</text>
    <text x="494" y="584">loopback + allowlisted port → demote</text>
    <text x="494" y="606">the analyser cannot un-alert a baseline miss</text>
    <text x="450" y="836" text-anchor="middle">scanner log, always: IOC FOUND and ALERT lines</text>
    <text x="450" y="938" text-anchor="middle">→ the memory server's news collection, daily digest</text>
    <text x="760" y="938" text-anchor="middle">the log is the only signal</text>
    <text x="54" y="906">agent: print the canonical hash</text>
    <text x="54" y="919">of the file it changed</text>
    <text x="54" y="940">Matron: update that agent's row</text>
    <text x="54" y="953">(owner-set, never inferred)</text>
  </g>

  <g fill="none" stroke="#7f8b94" stroke-width="1.3" marker-end="url(#gA)">
    <path d="M450,106 L450,146"></path>
    <path d="M450,210 L450,250"></path>
    <path d="M450,316 L450,370"></path>
    <path d="M450,440 L450,466 L140,466 L140,500"></path>
    <path d="M450,440 L450,466 L670,466 L670,500"></path>
    <path d="M570,620 L570,670"></path>
    <path d="M770,620 L770,670"></path>
    <path d="M570,730 L570,790"></path>
    <path d="M770,730 L770,760 L450,760 L450,790"></path>
    <path d="M450,850 L450,900"></path>
    <path d="M600,850 L600,872 L760,872 L760,900"></path>
  </g>
  <path d="M140,880 L140,860 L20,860 L20,405 L250,405" fill="none" stroke="#9aa5ad" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#gB)"></path>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#616c75">
    <text x="148" y="462">hash matches</text>
    <text x="678" y="462">no row, or hash differs</text>
    <text x="578" y="650">escalate</text>
    <text x="778" y="650">nothing bad</text>
    <text x="28" y="640">re-approval</text>
  </g>
  </svg>